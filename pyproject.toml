[project]
name = "aadithya-quantlab"
version = "0.1.0"
description = "Structured intraday NIFTY quantitative research laboratory."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "kiteconnect>=5.0.1",
  "streamlit>=1.60.0,<2",
  "keyring>=25.0",
]

[project.scripts]
kite-gateway = "kite_gateway.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
